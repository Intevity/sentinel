name: CI

on:
  # PRs are the gate; pushes to main additionally validate the actual merge
  # commit (a no-ff merge commit is new history the PR run never built) and
  # feed the README's CI badge, which filters on branch=main — without a
  # main run the badge would surface whichever PR run happened to finish
  # last, including red ones from in-flight branches (bit us when the repo
  # went public).
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'CHANGELOG.md'

# Node 24.19.0 shipped nodejs/node#63642 ("src: add cleanup hooks to
# node::ObjectWrap"), which makes NAN-style ObjectWrap addons abort during
# environment teardown: better-sqlite3's Statement destructor calls
# RemoveEnvironmentCleanupHook after the Environment is gone, tripping
# `Assertion failed: (env) != nullptr` and killing the process with SIGABRT.
# In CI that surfaced as vitest workers dying mid-run, taking whole test files
# with them and dropping coverage below the gate — with no code change to
# explain it, because a floating `'24'` pin picks up each new patch release.
# Pinned until better-sqlite3 adapts to the new hook contract; verified locally
# under both versions (24.19.0: 4-6 workers killed per run; 24.18.0: none).
env:
  NODE_VERSION: '24.18.0'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub release notes are generated verbatim from commit messages
  # (scripts/release-notes.mjs), so the conventional-commit shape is a
  # release-quality gate, not a style nit. Dependency-free node script —
  # deliberately no LLM and no commitlint package.
  commit-lint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The lint walks base..HEAD, so it needs more than the default
          # shallow single-commit checkout.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Lint commit messages (release notes are generated from them)
        run: node scripts/commit-lint.mjs "origin/${{ github.base_ref }}" HEAD

  # Skip the heavy app build/test + Playwright jobs when a PR only touches the
  # marketing site (packages/site/**) or docs — those never affect the app, so
  # rebuilding and testing it just burns CI minutes. commit-lint above still
  # runs on every PR, so release-note hygiene is never skipped, and
  # deploy-site.yml handles the site's own publish on merge.
  changes:
    name: Detect changed areas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The base..HEAD diff needs more than the default shallow checkout.
          fetch-depth: 0
      - id: filter
        name: Did anything outside the marketing site change?
        run: |
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "Changed files:"; echo "$changed"
          # App jobs run only when a file OUTSIDE site/docs changed. Mirrors the
          # doc globs in the workflow-level paths-ignore above.
          if echo "$changed" | grep -vE '^(packages/site/|docs/|LICENSE$|\.gitignore$|CHANGELOG\.md$|.*\.md$)' | grep -q .; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  lint-test:
    name: Quality Checks
    needs: changes
    # PRs: gated on the site-only filter above. Pushes to main: the filter job
    # is skipped (no base ref), so run unconditionally — this is the run the
    # README badge reports. !cancelled() lets the job proceed past a skipped
    # dependency without also running after a real cancellation.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Must match the local pnpm version that produced pnpm-lock.yaml —
      # pnpm 10 writes `pnpmfileChecksum` into the lockfile, and pnpm 9
      # rejects it with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. Keep this in
      # sync with release.yml if you bump either.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build outputs (dist/) + the platform-built better-sqlite3 binary are
      # deterministic for a given source tree + lockfile. Cache so the `e2e`
      # job downstream can hit the same key and skip rebuilding. Bump the
      # `build-v1-` prefix to invalidate.
      - name: Cache built packages + better-sqlite3 binary
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/shared/dist
            packages/daemon/dist
            packages/test-harness/dist
            node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3/build
          key: build-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/shared/src/**', 'packages/daemon/src/**', 'packages/test-harness/src/**') }}

      - name: Build better-sqlite3 native module
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          cd node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3
          npm run build-release
        shell: bash

      # Build shared first so its dist/ (types + JS) exists on disk — daemon
      # imports @sentinel/shared via package.json's `types` / `main`
      # which point at ./dist. Using tsc --noEmit on shared would typecheck
      # it but produce no dist, so the daemon typecheck then fails with
      # TS2307 "Cannot find module '@sentinel/shared'".
      - name: Build shared (emits dist/ for daemon typecheck)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @sentinel/shared run build

      # Same rule as shared above: test-harness exposes types via dist/
      # (package.json `types` → ./dist/index.d.ts). Daemon's
      # *.integration.test.ts files import from @sentinel/test-harness,
      # so the daemon build step below will fail with TS2307 unless dist
      # exists on disk.
      - name: Build test-harness (emits dist/ for daemon build)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @sentinel/test-harness run build

      # Daemon build serves dual purpose: typecheck (tsc fails on type
      # errors regardless of --noEmit) AND populates packages/daemon/dist
      # for the downstream e2e job's build-output cache hit.
      - name: Build daemon
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @sentinel/daemon run build

      - name: Lint
        run: pnpm exec eslint packages/daemon/src packages/shared/src

      - name: Format check
        run: pnpm run format:check

      - name: Mock budget check
        run: node scripts/mock-budget.mjs

      # Catches colour utilities whose colour the theme doesn't define — those
      # emit no CSS, so the element renders with no background/text colour at
      # all. v0.9.5 shipped a fully transparent modal because `bg-background`
      # (no such theme colour) passed type-check, tests, coverage and every
      # other gate here: none of them can see an unreadable panel.
      - name: Tailwind colour class check
        run: node scripts/tailwind-classes.mjs

      - name: Detector ReDoS check
        run: node scripts/check-detector-regex.mjs

      # Asserts the committed icon.ico keeps the full DPI ladder with the
      # 256px PNG entry FIRST (tauri #14596 renders the runtime window icon
      # from entries()[0]). Re-running `tauri icon` would silently ship the
      # 32-first, 6-entry ladder and reintroduce pixelated Windows icons.
      - name: Windows icon ladder check
        run: node scripts/generate-ico.mjs --verify

      - name: Fake API contract check
        run: pnpm exec vitest run packages/test-harness/src/fake-anthropic.contract.test.ts

      - name: Test with coverage (fails the job on threshold regression)
        run: pnpm exec vitest run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # The Tauri app's Rust unit tests. Separate job because it needs a Rust
  # toolchain and (on Linux) the GTK/WebKit system deps that the JS Quality
  # Checks job has no use for; runs in parallel so it costs no extra wall-clock.
  #
  # Added with `update_marker` — the update-attempt marker's classify logic is
  # the only thing standing between a silently-failed Windows install and a
  # user who never finds out, and before this job nothing ran `cargo test` at
  # all (release.yml only ever mentioned cargo for caching).
  #
  # windows-latest is in the matrix on purpose, not for redundancy: the updater
  # path is full of `#[cfg(not(windows))]` branches (the pre-install daemon stop
  # lives only there) and those branches cannot be compiled from a macOS or
  # Linux dev box — cross-checking needs the MSVC toolchain. Without this leg a
  # Windows-only compile error would surface for the first time in release.yml,
  # after merge, on a tag.
  rust-test:
    name: Rust Unit Tests (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.app == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri -> target
          key: ${{ matrix.os }}
          shared-key: tauri-ci

      # Same set the release workflow's Linux leg installs — tauri links
      # against WebKitGTK even for a `cargo test` that never opens a window.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # `tauri build` runs `beforeBuildCommand`, which produces both ../dist and
      # the daemon sidecar. A bare `cargo test` skips it, but tauri-build still
      # resolves `frontendDist` and hard-fails on a missing `externalBin`
      # ("resource path binaries/sentinel-daemon-<triple> doesn't exist").
      # Existence is all it checks at compile time — the bundler only copies
      # these during a real `tauri build` — so empty stubs are enough, and they
      # keep this job from having to install pnpm and run a pkg build just to
      # compile unit tests. bash (not the Windows runner's default pwsh) so one
      # recipe covers both legs.
      - name: Stub the frontend dist + daemon sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/app/dist
          touch packages/app/dist/index.html
          triple="$(rustc -vV | sed -n 's|^host: ||p')"
          ext=''
          [ "$RUNNER_OS" = 'Windows' ] && ext='.exe'
          mkdir -p packages/app/src-tauri/binaries
          touch "packages/app/src-tauri/binaries/sentinel-daemon-${triple}${ext}"
          ls -l packages/app/src-tauri/binaries/

      - name: Rust unit tests
        working-directory: packages/app/src-tauri
        run: cargo test

      - name: Clippy
        working-directory: packages/app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, lint-test]
    # Mirror of Quality Checks' condition, plus a hard success requirement on
    # it (needs.* results are bypassed once !cancelled() is used).
    if: ${{ !cancelled() && needs.lint-test.result == 'success' && (github.event_name == 'push' || needs.changes.outputs.app == 'true') }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirror the lint-test cache step — same key, so a successful lint-test
      # populates the entry and this job hits and skips the rebuilds below.
      - name: Cache built packages + better-sqlite3 binary
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/shared/dist
            packages/daemon/dist
            packages/test-harness/dist
            node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3/build
          key: build-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/shared/src/**', 'packages/daemon/src/**', 'packages/test-harness/src/**') }}

      - name: Build better-sqlite3 native module
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          cd node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3
          npm run build-release
        shell: bash

      - name: Build shared
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @sentinel/shared run build

      - name: Build daemon
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @sentinel/daemon run build

      - name: Build test-harness
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @sentinel/test-harness run build

      # No `playwright install` step on purpose. cdn.playwright.dev has
      # repeatedly stalled on GitHub runners (the chromium zip reaches 100%,
      # then the follow-up artifact fetch hangs; bounded retries all stalled
      # identically, so it's a deterministic CDN-path failure). The runner
      # image ships Google Chrome, and PLAYWRIGHT_CHANNEL=chrome (see
      # e2e/playwright.config.ts) makes the suite launch it directly —
      # nothing to download, nothing to stall.
      - name: Run Playwright
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: pnpm --filter @sentinel/app run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/app/playwright-report/
          retention-days: 7
